<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <main class="auth-card">
        <header>
            <h1>Create an account</h1>
            <p>Choose a username and password to get started.</p>
        </header>
        <form method="POST" action="/register">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
            </div>
            <button type="submit">Create account</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="/login">Log in</a></p>
    </main>
</body>
</html>
