<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resource Manager</title>
    <link rel="stylesheet" href="/static/css/resource.css" />
    <link rel="stylesheet" href="/static/css/card.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>Resource Manager</h1>
        <p class="subtitle">Create, update, and remove stored resources.</p>
      </header>

      <div class="workspace">
        <aside class="controls" aria-label="Resource actions">
          <section class="card">
            <h2>Find resource</h2>
            <form class="form-grid" method="GET" action="/resources">
              <div class="field">
                <label for="find_r_id">Resource ID</label>
                <input id="find_r_id" type="number" name="id" min="1" max="4294967295" step="1" required />
              </div>
              <button type="submit">Find resource</button>
            </form>
          </section>

          <section class="card">
            <h2>Create resource</h2>
            <form class="form-grid" method="POST" action="/resources/create">
              <div class="field">
                <label for="create_r_name">Resource Name</label>
                <input id="create_r_name" type="text" name="create_r_name" value="" />
              </div>
              <div class="field">
                <label for="create_r_number">Resource Number</label>
                <input id="create_r_number" type="text" name="create_r_number" value="" />
              </div>
              <button type="submit">Create resource</button>
            </form>
          </section>

          <section class="card">
            <h2>Update resource</h2>
            <form class="form-grid update" method="POST" action="/resources/update">
              <div class="field">
                <label for="update_r_id">Resource ID</label>
                <input id="update_r_id" type="number" name="update_r_id" value="" />
              </div>
              <div class="field">
                <label for="update_r_number">Resource Number</label>
                <input
                  id="update_r_number"
                  type="number"
                  name="update_r_number"
                  value=""
                />
              </div>
              <div class="field">
                <label for="update_r_name">Resource Name</label>
                <input id="update_r_name" type="text" name="update_r_name" value="" />
              </div>
              <button type="submit">Update resource</button>
            </form>
          </section>

          <section class="card">
            <h2>Delete resource</h2>
            <form class="form-grid" method="POST" action="/resources/delete">
              <div class="field">
                <label for="delete_r_id">Resource ID</label>
                <input id="delete_r_id" type="number" name="delete_r_id" value="" />
              </div>
              <button class="delete-button" type="submit">Delete resource</button>
            </form>
          </section>


        </aside>
        <section class="results" aria-labelledby="results-title">
          <header class="results-header">
            <h2 id="results-title">Stored resources</h2>
            <span class="resource-total">Total: {@total}</span>
          </header>
          <div class="resource-list">{@list_resource}</div>
        </section>
      </div>
    </main>
  </body>
</html>
